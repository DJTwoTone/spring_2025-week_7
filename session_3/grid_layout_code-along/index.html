<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout Code-Along</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
  <div class="container">
    <header>
      <h1>Site Header</h1>
    </header>

    <aside>
      <h2>Sidebar</h2>
      <p>Some links or info here.</p>
    </aside>

    <main>
      <h2>Main Content</h2>
      <p>This is where main text or articles would appear.</p>
    </main>

    <footer>
      <p>Site Footer</p>
    </footer>
  </div>

</body>
</html>
